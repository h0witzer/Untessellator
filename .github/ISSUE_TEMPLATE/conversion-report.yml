name: Conversion report
description: Tell us in public how a mesh converted, good or bad. To send a file privately, use Untessellator's flag button instead.
title: "Conversion report: "
labels: ["conversion report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Reports like this are how we learn where the models and fitters fail on real parts, so
        good results are as useful as bad ones.

        This form is public. To send a report file or a mesh privately, press the **flag** button in
        Untessellator and choose Send: it goes to a private inbox, up to 95 MB, with no GitHub account needed.
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Every face came out right (a fully analytic solid)
        - A closed solid, but some faces were wrong or came out as facets
        - A closed solid, but every face came out as facets
        - The export failed or wasn't a closed solid
        - Auto-paint got the faces wrong, so I didn't export
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did the mesh come from?
      options:
        - Exported from a CAD program
        - Downloaded (Printables, MakerWorld, Thingiverse or similar)
        - A 3D scan
        - Sculpted, or a game or film asset
        - Something else
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: What's the part, and which program made the mesh?
      placeholder: "A bracket with fillets, exported from Fusion as a fine STL"
  - type: textarea
    id: wrong
    attributes:
      label: What went wrong, and where?
      description: Which faces were wrong, split up or turned into facets. A screenshot with the face groups showing helps most.
  - type: textarea
    id: numbers
    attributes:
      label: Untessellator's numbers
      description: Optional. The summary at the top of a saved report file's report.json, if you have one.
      render: text
  - type: textarea
    id: files
    attributes:
      label: The report file, and screenshots
      description: >-
        Screenshots help most. You can also drag in a report file saved with the flag button's Save the
        file, but this repository is public and GitHub caps files at 25 MB. To send one privately, use
        Send in Untessellator instead.
