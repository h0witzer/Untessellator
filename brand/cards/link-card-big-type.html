<!doctype html>
<html><head><meta charset="utf-8">
<!-- The link card redrawn so nothing is under 40px, for LinkedIn and phones. 1280x640. Not live: the smaller-type link-card.png read fine on a phone. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
  /* Link card: read at ~500px wide (desktop feed) and ~350px (phone), so nothing under 40px. */
  html, body { margin: 0; background: #2a1638; }
  .c { width: 1280px; height: 640px; position: relative; overflow: hidden; background: #2a1638; font-family: "Chakra Petch", sans-serif; }
  .left { position: absolute; left: 72px; top: 0; bottom: 28px; width: 620px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
  .left img { width: 580px; display: block; }
  .t { color: #f5effb; font: 700 64px/1.04 "Chakra Petch", sans-serif; letter-spacing: -0.005em; }
  .f { color: #c9a8ff; font: 600 40px/1 "Chakra Petch", sans-serif; letter-spacing: 0.03em; }
  .f b { color: #ffc933; font-weight: 700; }
  .part { position: absolute; right: 48px; top: 50%; transform: translateY(-52%); height: 500px; display: block; filter: drop-shadow(0 18px 30px rgba(10, 4, 18, 0.55)); }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: url(../facet-band.svg) left / 100% 100% no-repeat; }
</style></head>
<body data-scale="1"><div class="card c">
  <div class="left">
    <img src="../wordmark-on-plum.svg" alt="">
    <div class="t">Turn meshes back<br>into real CAD.</div>
    <div class="f">STL · OBJ · 3MF <b>→</b> STEP</div>
  </div>
  <img class="part" src="part-cut.png" alt="">
  <div class="band"></div>
</div></body></html>
