<!doctype html>
<html><head><meta charset="utf-8">
<!-- The link card for untessellator.com and the repo: brand/social-preview.png (copy of link-card.png). 1280x640. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  html, body { margin: 0; background: #2a1638; }
  .c { width: 1280px; height: 640px; position: relative; overflow: hidden; background: #2a1638; font-family: "Chakra Petch", sans-serif; }
  .left { position: absolute; left: 72px; top: 0; bottom: 24px; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .left img { width: 600px; display: block; }
  .t { color: #f5effb; font: 700 44px/1.08 "Chakra Petch", sans-serif; margin-top: 10px; }
  .s { color: #c7b6da; font: 500 22px/1.4 "Chakra Petch", sans-serif; letter-spacing: 0.02em; }
  .u { color: #b98cff; font: 600 24px/1 "Chakra Petch", sans-serif; letter-spacing: 0.04em; margin-top: 6px; }
  /* the part, keyed off the stage onto the plum */
  .part { position: absolute; right: 70px; top: 50%; transform: translateY(-52%); height: 470px; display: block; filter: drop-shadow(0 18px 30px rgba(10, 4, 18, 0.55)); }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: url(../facet-band.svg) left / 100% 100% no-repeat; }
</style></head>
<body data-scale="1"><div class="card c">
  <div class="left">
    <img src="../wordmark-on-plum.svg" alt="">
    <div class="t">Turn meshes back<br>into real CAD.</div>
    <div class="s">STL, OBJ and 3MF to STEP solids with exact planes,<br>cylinders, cones, spheres and tori. Free, in your browser.</div>
    <div class="u">untessellator.com</div>
  </div>
  <img class="part" src="part-cut.png" alt="">
  <div class="band"></div>
</div></body></html>
